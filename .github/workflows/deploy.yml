name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Pull requests run every check but never deploy.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time, never cancelled midway. Pull requests get
# their own group, and a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build alone was the only gate here, so a type error or a broken
      # route could ship. These run before it for a fast, specific failure.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint (React hooks)
        run: npm run lint:hooks

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Asserts every public route has a shell GitHub Pages can serve, and
      # that the bundle and media stay inside their size budgets.
      - name: Verify dist
        run: npm run verify:dist

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
