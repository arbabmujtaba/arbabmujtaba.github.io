<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030407" />
    <meta
      name="description"
      content="Arbab Mujtaba — an archive still being written. Engineering projects, essays, photography, and a working index of tools and references."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are self-hosted (src/fonts.css): no third-party connections in
         the critical path. The two faces every page sets above the fold —
         the grotesk and the mono — are fetched with the HTML; the rest load
         on first use with font-display: swap. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/host-grotesk-normal-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fragment-mono-normal-latin.woff2" crossorigin />
    <script>
      // Day or night before the first paint, so the page never flashes the
      // wrong surface. Mirrors resolveTheme() in src/lib/magic.tsx.
      (function () {
        try {
          var pref = localStorage.getItem('archive.theme') || 'night';
          var h = new Date().getHours();
          var theme = pref === 'day' || pref === 'night' ? pref : h >= 6 && h < 18 ? 'day' : 'night';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'night');
        }
      })();
    </script>

    <script>
      // The home hero is the largest paint, but it is only discovered after the
      // app and the home chunk have loaded. Start fetching it now — home only,
      // and the same sources HeroPlate in src/pages/Home.tsx renders (a wide
      // set on landscape screens, a tall one otherwise), so it is one request
      // either way. __HERO_PRELOAD__ is written by the hero-preload plugin in
      // vite.config.ts from the Hero photo chosen in /admin (src/lib/hero.ts).
      var heroSets = __HERO_PRELOAD__;
      var set = matchMedia('(orientation: landscape)').matches ? heroSets.wide : heroSets.tall;
      if (location.pathname === '/' && set) {
        var hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.type = 'image/webp';
        hero.setAttribute('fetchpriority', 'high');
        hero.setAttribute('imagesrcset', set);
        hero.setAttribute('imagesizes', '100vw');
        document.head.appendChild(hero);
      }
    </script>

    <title>Arbab Mujtaba — Archive</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arbab Mujtaba" />
    <meta property="og:title" content="Arbab Mujtaba — Archive" />
    <meta
      property="og:description"
      content="An archive still being written. Engineering projects, essays, photography, and a working index of tools and references."
    />
    <meta property="og:url" content="https://arbabmujtaba.github.io/" />
    <meta property="og:image" content="https://arbabmujtaba.github.io/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arbab Mujtaba — Archive" />
    <meta
      name="twitter:description"
      content="An archive still being written. Engineering projects, essays, photography, and a working index of tools and references."
    />
    <meta name="twitter:image" content="https://arbabmujtaba.github.io/portrait.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
